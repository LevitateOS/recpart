[package]
name = "recpart"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Mode-aware partition planning and apply backend for LevitateOS"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
target-root = { path = "../recstrap/target-root" }
libc = { workspace = true }
schemars = { workspace = true, optional = true }
ts-rs = { workspace = true, optional = true }

[features]
# Derive the JSON Schemas and TypeScript declarations of the JSON output
# (`cargo xtask gen`); the shipped tool does not need them.
contracts = ["dep:schemars", "dep:ts-rs"]

[dev-dependencies]
tempfile = { workspace = true }
