[package]
name = "recpart"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Mode-aware partition planning and apply backend for LevitateOS"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
target-root = { path = "../recstrap/target-root" }
libc = "0.2"
schemars = { version = "1", optional = true }
ts-rs = { version = "12", optional = true }

[features]
# Derive the JSON Schemas and TypeScript declarations of the JSON output
# (`cargo xtask gen`); the shipped tool does not need them.
contracts = ["dep:schemars", "dep:ts-rs"]

[dev-dependencies]
tempfile = "3"
